<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="card card-auto" role="img" width="760" height="420" viewBox="0 0 760 420" aria-labelledby="title desc">
  <title id="title">Buildmarks project card for example-builder</title>
  <desc id="desc">Rocket Courier. The version has landed. Unpacking instructions are the next delivery. Buildmarks reviewed 2 repositories and found 30 project practices. The overall result is Platinum III, 82 out of 100. Maintainability Diamond II, 97 out of 100, Project Readiness Gold I, 66 out of 100, Ease of Use Gold II, 59 out of 100, Shipping Diamond I, 100 out of 100, Consistency Diamond I, 100 out of 100, Project Care Platinum V, 72 out of 100. This card is based on public GitHub repositories only. Buildmarks is not a developer ranking.</desc>
  <style>.card { --surface:#e9f5f6;--text:#123944;--muted:#416772;--accent:#14717a;--secondary:#5c7622;--track:#c8e2e5;--chip:#d9ecee;--line:#b5d7db; }
    .card-dark { --surface:#0d2831;--text:#fff5e4;--muted:#aecdd3;--accent:#65dbdf;--secondary:#daf787;--track:#20515e;--chip:#153e49;--line:#41737c; }
    @media (prefers-color-scheme: dark) { .card-auto { --surface:#0d2831;--text:#fff5e4;--muted:#aecdd3;--accent:#65dbdf;--secondary:#daf787;--track:#20515e;--chip:#153e49;--line:#41737c; } }
    text { font-family:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:var(--text); }
    .surface { fill:var(--surface); }
    .brand { font-size:20px; font-weight:750; }
    .username { font-size:20px; font-weight:650; }
    .cover-title { font-size:30px; font-weight:800; letter-spacing:-.5px; }
    .tagline { font-size:13px; fill:var(--muted); }
    .profile-score { font-size:24px; font-weight:750; text-anchor:end; }
    .cover-serif { font-family:Georgia, "Times New Roman", serif; letter-spacing:-.5px; }
    .metric { font-size:15px; font-weight:600; }
    .value { font-size:15px; font-weight:700; text-anchor:end; font-variant-numeric:tabular-nums; }
    .missing { font-size:12px; font-weight:500; fill:var(--muted); }
    .missing-track { stroke:var(--line); stroke-width:2; stroke-dasharray:3 5; }
    .checked { font-size:12px; font-weight:600; fill:var(--muted); text-anchor:end; }
    .caption { font-size:12px; font-weight:600; fill:var(--muted); }
    .footer { font-size:12px; font-weight:500; fill:var(--muted); }
    .divider { stroke:var(--line); stroke-width:1; }
    .track { fill:var(--track); }
    .bar,.accent { fill:var(--accent); }
    .secondary { fill:var(--secondary); }
    .emblem-stroke { stroke:var(--accent); }
    .art-line { stroke:var(--line); fill:none; stroke-width:1; }
    .art-ink { stroke:var(--text); }
    .art-page { fill:#fff4e5; }
    .art-page + .art-ink { stroke:#203044; }
    .chip-bg { fill:var(--chip); }
    .chip { font-size:12px; font-weight:600; }
  </style>
