  <title id="title">Buildmarks project card for Sample data · example-builder</title>
  <desc id="desc">Trail Opener. The path is easy to follow. A clearer trailhead sign would complete the map. Buildmarks reviewed 2 repositories and found 30 project practices. The overall result is Gold I, 69 out of 100. Maintainability Platinum V, 70 out of 100, Project Readiness Gold III, 42 out of 100, Ease of Use Diamond IV, 92 out of 100, Shipping Platinum V, 70 out of 100, Consistency Platinum V, 70 out of 100, Project Care Platinum V, 70 out of 100. This card is based on public GitHub repositories only. Buildmarks is not a developer ranking. Representative projects: example-builder/usable-toolkit: Release + changelog; Tests + workflow. example-builder/small-experiment: License found</desc>
